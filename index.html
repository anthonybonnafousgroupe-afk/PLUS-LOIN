<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030B1C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PLUS LOIN">
<meta name="description" content="Coach running et trail : plan personnalisé vers ton ultra, suivi des séances, exercices animés.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}.f.bad input,.f.bad select{border-color:var(--accent)!important;box-shadow:0 0 0 3px var(--accent-soft)}
</style>
</head>
<body>
<title>PLUS LOIN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500;600&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout : décor 3D plein écran fixe (montagne, nuages) derrière une colonne de contenu (max 580px) en verre bleuté ; typographie fine et espacée. */
:root{
  --bg:#030B1C; --bg-2:#071733; --surface:#0B1D3D; --surface-2:#132A52; --glass:rgba(8,24,58,.42);
  --ink:#EAF1FF; --ink-2:#A6B9DA; --ink-3:#6E85AD; --line:rgba(160,195,255,.15);
  --accent:#FF7A45; --accent-2:#FFC38A; --accent-ink:#1B0904; --accent-soft:rgba(255,122,69,.16); --glacier:#5AA9FF;
  --mark:#FFC38A; --mark-soft:rgba(255,195,138,.12); --good:#4FD18B; --good-soft:rgba(79,209,139,.14); --warn:#FFC38A; --bad:#FF6A55;
  --z1:#7E9CC9; --z2:#4FD18B; --z3:#FFD25A; --z4:#FF8A3D; --z5:#FF4A3D;
  --f-display:"Jost","Avenir Next","Century Gothic",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:22px; --shadow:0 24px 50px -30px rgba(0,6,20,.9),inset 0 1px 0 rgba(200,220,255,.08);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:#030B1C}
body{background:linear-gradient(180deg,#01060F 0%,#041431 34%,#0A2C66 66%,#13479A 88%,#1B58B0 100%) fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100%}
#bg3d{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;display:block}
.bgshade{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(2,8,22,.55),rgba(2,8,22,.35) 40%,rgba(2,8,22,.6));opacity:1;transition:opacity 1.2s ease}
body.is-home .bgshade{opacity:0}
.app{position:relative;z-index:1}
main{transition:opacity .55s ease,transform .8s cubic-bezier(.2,.7,.2,1),filter .6s ease}
main.leave{opacity:0;transform:translateY(-46px) scale(.97);filter:blur(12px)}
main.enter{opacity:0;transform:translateY(70px) scale(.98);filter:blur(14px);transition:none}
body.flying nav.bottom{pointer-events:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#01060F}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{max-width:580px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(3,11,28,.55);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 12px;margin-inline:-16px;padding-inline:16px}
.brand{display:flex;align-items:center;gap:10px}
.balise{width:22px;height:16px;border-radius:2px;overflow:hidden;display:grid;grid-template-rows:1fr 1fr;box-shadow:0 0 0 1px var(--line)}
.balise i:first-child{background:#fff}.balise i:last-child{background:var(--accent)}
.brand b{font-family:var(--f-display);font-weight:400;font-size:21px;letter-spacing:.32em;line-height:1}
.brand small{display:block;font-size:11px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.iconbtn{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;height:38px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.iconbtn svg{width:18px;height:18px}
main{display:flex;flex-direction:column;gap:16px;padding-top:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:300;letter-spacing:.06em;line-height:1.08;margin:0;text-wrap:balance}
h1{text-transform:uppercase;letter-spacing:.12em}
h1{font-size:34px} h2{font-size:24px} h3{font-size:19px}
p{margin:0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)} .small{font-size:13px}
.card{background:linear-gradient(180deg,rgba(170,200,255,.07),rgba(170,200,255,.015)),var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;background:linear-gradient(135deg,var(--accent),#FF8A3D);box-shadow:0 10px 24px -12px rgba(255,90,60,.8),inset 0 1px 0 rgba(255,255,255,.25);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn.secondary{background:var(--surface-2);color:var(--ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.mark{background:var(--mark-soft);color:var(--warn)}
.chip.good{background:var(--good-soft);color:var(--good)}
.zdot{width:9px;height:9px;border-radius:50%;display:inline-block}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--f-display);font-size:28px;font-weight:300;line-height:1}
.stat .v small{font-size:15px;color:var(--ink-2);font-weight:600;margin-left:2px}
.stat .l{font-size:12px;color:var(--ink-3);font-weight:600}
.banner{border:1px dashed var(--mark);background:var(--mark-soft);border-radius:12px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.banner b{color:var(--ink)}
/* Session */
.session-head{display:flex;gap:14px;align-items:flex-start}
.int{display:flex;gap:3px;align-items:flex-end;height:22px}
.int i{width:6px;border-radius:2px;background:var(--surface-2)}
.int i.on{background:var(--accent)}
.blocks{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px;padding-left:14px;gap:12px}
.blk{position:relative}
.blk::before{content:"";position:absolute;left:-21px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--ink-3)}
.blk.main::before{border-color:var(--accent);background:var(--accent)}
.blk b{display:block;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.blk p{color:var(--ink-2);font-size:14px}
.why{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink-2)}
.why b{color:var(--ink)}
/* Week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:10px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;font-size:11px;color:var(--ink-3);font-weight:600}
.day .d{font-family:var(--f-display);font-size:18px;color:var(--ink);font-weight:400;line-height:1}
.day .t{width:22px;height:5px;border-radius:3px;background:var(--surface-2)}
.day.sel{border-color:rgba(255,90,60,.7);background:var(--accent-soft);box-shadow:0 0 0 1px rgba(255,90,60,.5),0 10px 20px -12px rgba(255,90,60,.8)}
.day.today .d{color:var(--accent)}
.day.done::after{content:"✓";font-size:11px;color:var(--good);line-height:1}
/* Nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:25;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
nav.bottom .in{pointer-events:auto;max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);background:rgba(6,18,44,.62);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 40px -16px rgba(0,0,0,.9)}
nav.bottom button{background:none;border:0;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;min-width:0;font-weight:600;color:var(--ink-3)}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button[aria-current="page"]{color:var(--ink)}
nav.bottom button[aria-current="page"] svg{color:var(--accent);filter:drop-shadow(0 0 8px rgba(255,90,60,.7))}
/* forms */
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--ink-2);min-width:0}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:10px;padding:10px 12px;font-size:15px;font-weight:500;width:100%;min-width:0}
label.f .hint{font-weight:500;color:var(--ink-3);font-size:11px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:40px;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:10px;padding:8px 4px;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* readiness ring */
.gauge{position:relative;width:76px;height:76px;flex:none}
.gauge svg{width:76px;height:76px;transform:rotate(-90deg)}
.gauge span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:24px;font-weight:300}
/* zones table */
.ztable{width:100%;border-collapse:collapse;font-size:13px}
.ztable td,.ztable th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.ztable th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.ztable td.num{text-align:right;white-space:nowrap}
.tablewrap{overflow-x:auto}
/* Exercises */
.exgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:520px){.exgrid{grid-template-columns:repeat(3,1fr)}}
.ex{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:16px;transition:transform .2s;padding:8px 8px 10px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.ex .figbox{background:radial-gradient(circle at 50% 30%,#18315E,#0B1B3A);border-radius:12px}
.ex b{font-size:14px;line-height:1.2}
.ex span{font-size:11px;color:var(--ink-3);font-weight:600}
svg.fig{width:100%;height:auto;display:block}
.fig .ground{stroke:rgba(255,255,255,.18);stroke-width:1.5}
.fig .prop{fill:var(--line);stroke:var(--ink-3);stroke-width:1.2}
.fig .far{stroke:var(--ink-3);stroke-width:6;stroke-linecap:round;fill:none;opacity:.6}
.fig .near{stroke:var(--ink);stroke-width:7;stroke-linecap:round;fill:none}
.fig .hl{stroke:var(--accent);filter:drop-shadow(0 0 4px rgba(255,90,60,.6))}
.fig .head{fill:var(--ink)}
.fig .hipdot{fill:var(--accent)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* Sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,16,14,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:linear-gradient(180deg,#0E2247,#06122B);border-top:1px solid var(--line);width:100%;max-width:580px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet .figbig{background:radial-gradient(circle at 50% 30%,#18315E,#0B1B3A);border-radius:14px;border:1px solid var(--line)}
ol.steps,ul.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
ul.list.bad li::marker{color:var(--bad)}
ul.list.good li::marker{color:var(--good)}
/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart .lbl{fill:var(--ink-3);font-size:10px;font-family:var(--f-body)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* log */
.score{font-family:var(--f-display);font-weight:300;font-size:40px;line-height:1}
.score small{font-size:18px;color:var(--ink-3)}
.logitem{display:flex;gap:12px;align-items:center;text-align:left;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
.logitem .sc{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:500;font-size:22px;flex:none}
.drop{border:1.5px dashed rgba(255,255,255,.16);border-radius:18px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;background:rgba(255,255,255,.03)}
.drop.over{border-color:var(--accent)}
.zbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.zbar i{display:block;height:100%}
.preview{max-height:240px;border-radius:10px;object-fit:contain;background:var(--surface-2)}
.spinner{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.profile-svg{width:100%;height:auto;display:block}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{padding:10px 12px;border-radius:12px;max-width:88%;white-space:pre-wrap;font-size:14px}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg)}
.msg.co{align-self:flex-start;background:var(--surface-2)}
details.acc{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:0}
details.acc summary{padding:14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.acc summary::after{content:"+";color:var(--ink-3);font-weight:700}
details.acc[open] summary::after{content:"–"}
details.acc .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px;color:var(--ink-2);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;z-index:60;max-width:90%}
/* Accueil */
.hello{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.hello-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.greet{font-size:clamp(30px,9vw,46px);line-height:1.02;letter-spacing:.14em;font-weight:200;text-transform:uppercase}
.greet .grad{font-weight:500}
.grad{background:linear-gradient(100deg,#FFD7A8 0%,var(--accent-2) 30%,var(--accent) 75%);-webkit-background-clip:text;background-clip:text;color:transparent}
.clock{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.clock .t{font-family:var(--f-display);font-weight:200;font-size:46px;line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.clock .t span{color:var(--ink-3);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.wx{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px}
.wx .ico{width:56px;height:56px}
.wx .temp{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1}
.wx .temp small{font-size:18px;color:var(--ink-2)}
.wx .meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.wx .meta b{font-size:15px}
.wx .side{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px;color:var(--ink-2);text-align:right}
.wx-tip{grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px;font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:flex-start}
.wx-tip b{color:var(--ink)}
.hero3d{padding:0;overflow:hidden;position:relative;min-height:340px}
.hero3d .slot{position:absolute;inset:0;cursor:grab;touch-action:pan-y}
.hero3d .slot:active{cursor:grabbing}
.hero3d canvas{display:block;width:100%;height:100%}
.hero3d .ov{position:relative;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;min-height:340px;padding:16px 18px;background:linear-gradient(180deg,rgba(7,11,16,.75) 0%,transparent 34%,transparent 62%,rgba(7,11,16,.9) 100%)}
.hero3d .ov .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.jcount{font-family:var(--f-display);font-weight:300;font-size:46px;line-height:.9;text-align:right}
.jcount small{display:block;font-size:12px;font-family:var(--f-body);font-weight:600;color:var(--ink-2);letter-spacing:.04em}
.pbar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent));box-shadow:0 0 12px rgba(255,90,60,.8)}
.hint3d{font-size:11px;color:var(--ink-3)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{padding:14px 12px;gap:6px;align-items:flex-start;transform-style:preserve-3d;transition:transform .25s ease}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:300;line-height:1}
.kpi .v small{font-size:14px;color:var(--ink-2)}
.kpi .l{font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.kpi .bar{width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.kpi .bar i{display:block;height:100%;border-radius:2px}
.tilt{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s ease}
/* Accueil immersif */
body.is-home .app{padding-bottom:0}
body.is-home main{padding-top:0}
body.is-home header.top{position:absolute;left:0;right:0;max-width:580px;margin:0 auto;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.home{position:relative;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:640px;max-height:980px}
@media (min-width:612px){.home{margin-inline:0}}
.home .slot{position:absolute;inset:0;touch-action:pan-y}

/* ============ Physiologie ============ */

/* ============ Plan ============ */
const PHASES = { "Base": "var(--z1)", "Développement": "var(--z2)", "Spécifique": "var(--z4)", "Affûtage": "var(--mark)", "Course": "var(--accent)" };
const PHASE_WHY = {

  "Développement": "Relever le seuil, apprendre à monter efficacement, allonger la sortie longue.",

function weekOf(date) {

// Marche-course : étape atteinte en semaine i (les semaines allégées répètent l'étape précédente)

function sessionFor(date, opts = {}) {

function nutrition() {
  const P = S.profile; const w = weekOf(TODAY);
  const bmr = 10 * P.poids + 6.25 * P.taille - 5 * P.age + (P.sexe === "F" ? -161 : 5);
  const train = (w ? w.km : P.kmSemaine) * P.poids * 1.0 / 7;
  const kcal = Math.round((bmr * 1.4 + train) / 50) * 50;
  return { kcal, prot: [Math.round(P.poids * 1.4), Math.round(P.poids * 1.7)], glu: [Math.round(P.poids * 5), Math.round(P.poids * 7)], lip: Math.round(P.poids * 1), eau: Math.round(P.poids * 35 / 100) / 10, imc: (P.poids / Math.pow(P.taille / 100, 2)).toFixed(1) };
}

function progressNow() { const w = weekOf(TODAY); return w ? clamp((daysBetween(S.plan.start, TODAY) + 1) / (S.plan.weeks.length * 7), 0, 1) : 1; }

const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

let NAV_BUSY = false;

  if (NAV_BUSY) return; NAV_BUSY = true;

  setTimeout(() => {
    UI.view = view; render(); scrollTo(0, 0); after && after();

    requestAnimationFrame(() => { main.classList.remove("enter"); });

document.addEventListener("click", e => {

  else if (a === "manual") manualSheet(t.dataset.date || ($("#log-date") ? $("#log-date").value : TODAY));
  else if (a === "mark-done" || a === "mark-miss") { S.done = S.done || {}; S.done[t.dataset.date] = a === "mark-done" ? "fait" : "non"; persist(); render(); toast(a === "mark-done" ? "Bravo, séance validée" : "Séance notée comme non réalisée"); }
